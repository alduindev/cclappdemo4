<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>App CCL</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0c151e}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="cclApp" src="/index.html" title="App CCL"></iframe><script id="cclPatch" type="text/plain">(function(){function firstName(){const raw=(user&&user.name)||(state.activeProfile&&state.activeProfile.name)||'Usuario';return String(raw).trim().split(/\s+/)[0]}function profileLabel(){const p=state.activeProfile;if(!p)return'Tu cuenta CCL';return p.type==='empresa'?p.name:'Tu cuenta CCL'}function ico(name,size){try{return icon(name,size||'')}catch(e){return''}}function xico(name,size){try{return extraIcon(name,size||'')}catch(e){return ico(name,size)}}cfg.title='Mi CCL';document.title='App CCL';renderTopbar=function(){const p=state.activeProfile||{};if(state.page==='home')return `<div class="topbar"><div><h2>Hola, ${firstName()}</h2><p>${profileLabel()}</p></div><button class="avatar" onclick="goToPage('profile')">${p.type==='empresa'?'E':'AS'}</button></div>`;const titles={services:'Servicios',events:'Eventos',news:'Noticias',network:'Conecta Empresas',camila:'Camila',profile:'Perfil',profileEdit:'Editar perfil'};const subtitles={services:'Soluciones para tu empresa',events:'Agenda CCL',news:'Actualidad empresarial',network:'Afinidad por intereses',camila:'Asistente virtual',profile:'Cuenta y seguridad',profileEdit:'Actualiza tus datos'};return `<div class="topbar"><div><h2>${titles[state.page]||'Mi CCL'}</h2><p>${subtitles[state.page]||''}</p></div><button class="avatar" onclick="goToPage('profile')">${p.type==='empresa'?'E':'AS'}</button></div>`};homeView=function(){return `<div class="view"><button class="web-hero tap-card" style="background-image:linear-gradient(180deg,rgba(8,22,34,.08),rgba(8,22,34,.82)),url('${cfg.hero}')" onclick="goToPage('network')"><div class="web-hero-copy"><b>PARA TI</b><strong>Conecta y haz crecer tu empresa</strong><small>Oportunidades, contactos y atención personalizada desde un solo lugar.</small></div></button><div class="member-actions"><button class="panel tap-card" onclick="goToPage('services')"><h3>Servicios</h3><p>Soluciones CCL</p></button><button class="panel tap-card" onclick="goToPage('network')"><h3>Conectar</h3><p>Empresas afines</p></button><button class="panel tap-card" onclick="goToPage('camila')"><h3>Camila</h3><p>Consultar</p></button></div><button class="match-teaser tap-card" onclick="goToPage('events')"><div><strong>Tu próxima actividad</strong><small>4 actividades disponibles este mes. Revisa la agenda completa.</small></div><div class="match-badge">${ico('calendar')}</div></button><button class="panel tap-card" onclick="goToPage('news')"><div class="compact-section-head"><div><strong>Noticias para tu empresa</strong><small>Consulta las novedades empresariales.</small></div>${xico('news','sm')}</div></button></div>`};try{render()}catch(e){console.error(e)}})();</script><script>const frame=document.getElementById('cclApp');frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;const script=doc.createElement('script');script.textContent=document.getElementById('cclPatch').textContent;doc.documentElement.appendChild(script)}catch(e){console.error(e)}})</script></body></html>
