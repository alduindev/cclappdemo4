<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Concierge</title>
<style>
:root{--navy:#0c2742;--blue:#286f9f;--gold:#d5b16d;--bg:#edf4f8;--soft:#f8fbfd;--text:#183247;--muted:#6f8494;--line:rgba(13,47,82,.08);--safe:env(safe-area-inset-bottom,0px);--logo:url('https://www.camaralima.org.pe/wp-content/uploads/2026/05/logo-ccl-1536x349-1.webp');}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef3f8 0%,#e7eff5 100%);color:var(--text)}
body{display:grid;place-items:center;padding:16px}
button,input,select{font:inherit} button{cursor:pointer}
.frame{width:390px;height:844px;background:#0b1620;border-radius:38px;padding:10px;box-shadow:0 26px 80px rgba(8,18,28,.26);position:relative}
.phone{height:100%;border-radius:30px;overflow:hidden;background:var(--soft);position:relative}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:142px;height:26px;border-radius:0 0 18px 18px;background:#0b1620;z-index:60}
#app{height:100%;overflow:hidden}
.toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,12px);opacity:0;transition:.25s ease;background:var(--navy);color:#fff;padding:12px 14px;border-radius:14px;font-size:12px;box-shadow:0 16px 28px rgba(13,47,82,.18);max-width:84%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:70}.toast.show{opacity:1;transform:translate(-50%,0)}
.splash{position:absolute;inset:0;z-index:65;transition:opacity .45s ease, visibility .45s ease} .splash.hide{opacity:0;visibility:hidden}
.splash.center{display:grid;place-items:center}
.splash-brand{display:grid;place-items:center;gap:16px;text-align:center;padding:24px}
.loader-bar{width:170px;height:7px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden} .loader-bar span{display:block;height:100%;width:48%;background:linear-gradient(90deg,#fff,var(--gold));border-radius:inherit;animation:slidebar 1.35s ease-in-out infinite}
.loader-dots{display:flex;gap:8px} .loader-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);animation:pulse 1.2s ease-in-out infinite} .loader-dots span:nth-child(2){animation-delay:.15s} .loader-dots span:nth-child(3){animation-delay:.3s}
.ring{width:74px;height:74px;border-radius:50%;border:4px solid rgba(255,255,255,.16);border-top-color:var(--gold);animation:spin 1.2s linear infinite;position:relative} .ring::after{content:'';position:absolute;inset:16px;border-radius:50%;background:rgba(255,255,255,.92)}
.tech-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px} .tech-grid span{aspect-ratio:1;border-radius:12px;background:linear-gradient(135deg,rgba(40,117,167,.12),rgba(213,177,109,.12));animation:pulse 1.4s ease-in-out infinite} .tech-grid span:nth-child(2n){animation-delay:.2s} .tech-grid span:nth-child(3n){animation-delay:.35s}
@keyframes spin{to{transform:rotate(360deg)}} @keyframes pulse{0%,100%{transform:scale(.84);opacity:.44}50%{transform:scale(1.16);opacity:1}} @keyframes slidebar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}

.official-logo,.official-isotipo,.brand-textual,.official-combo{display:grid;place-items:center}
.official-logo .logo-box{display:grid;place-items:center;padding:14px 18px;border-radius:24px;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18)}
.official-logo img{width:224px;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.08))}
.official-logo.md img{width:196px}
.official-isotipo .symbol-box{width:96px;height:96px;border-radius:30px;overflow:hidden;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);display:grid;place-items:center;box-shadow:0 16px 36px rgba(0,0,0,.10)}.official-isotipo .symbol-box.mono{background:rgba(255,255,255,.92);border:1px solid rgba(13,47,82,.08)}.mono-word{font-size:30px;font-weight:900;letter-spacing:.16em;text-indent:.16em;color:var(--navy);line-height:1}.official-isotipo.sm .mono-word{font-size:24px}
.official-isotipo img{width:230px;height:70px;object-fit:cover;object-position:left center;transform:translateX(4px)}
.official-isotipo.sm .symbol-box{width:82px;height:82px;border-radius:26px}
.official-isotipo.sm img{width:200px;height:60px}
.brand-textual .text-card{padding:14px 18px;border-radius:24px;background:rgba(255,255,255,.82);border:1px solid rgba(13,47,82,.08);box-shadow:0 18px 34px rgba(13,47,82,.08)}
.brand-textual b{display:block;font-size:11px;letter-spacing:.18em;color:var(--muted);margin-bottom:8px}
.brand-textual strong{display:block;font-size:28px;line-height:1.06;color:var(--navy)}
.brand-textual small{display:block;font-size:12px;line-height:1.5;color:#566b7d;margin-top:8px}
.official-combo .combo-box{display:inline-flex;align-items:center;gap:12px;padding:14px 16px;border-radius:24px;background:rgba(255,255,255,.14);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18)}
.official-combo .text-logo img{width:170px;height:auto;display:block}
.hero-brand{display:grid;justify-items:center;gap:10px;margin-bottom:14px}
.hero-copy-centered{text-align:center;display:grid;justify-items:center;gap:8px}
.start-copy{font-size:13px;line-height:1.55;max-width:280px;color:#e7eef5}
.start-copy.dark{color:#567082}

.screen-auth,.screen-app{height:100%;overflow:hidden}
.screen-auth{display:grid;background:radial-gradient(circle at top right, rgba(213,177,109,.18), transparent 25%), radial-gradient(circle at left top, rgba(40,117,167,.12), transparent 20%), var(--bg)}
.auth-page{height:100%;padding:26px 16px 16px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:hidden}.auth-page>*{width:min(100%,358px);margin-inline:auto}
.auth-hero{padding:18px;border-radius:28px;color:#fff;position:relative;overflow:hidden;min-height:176px;display:grid;place-items:center;text-align:center;width:100%}
.auth-hero p{margin:0;max-width:270px;font-size:13px;line-height:1.55;color:#e7eff5}
.auth-hero h1{margin:0;font-size:28px;line-height:1.06;letter-spacing:-.02em}
.auth-hero.image{background:linear-gradient(180deg,rgba(20,52,81,.42),rgba(20,52,81,.84)), url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=70') center/cover no-repeat}
.auth-hero.solid{background:linear-gradient(135deg,rgba(13,47,82,.96),rgba(31,111,167,.78))}
.auth-hero.light{background:linear-gradient(180deg,#fff 0%,#f5f9fc 100%);color:var(--navy);border:1px solid rgba(13,47,82,.06)}
.auth-hero.light p{color:#5f7586}
.auth-hero.premium{background:linear-gradient(180deg,rgba(7,23,38,.22),rgba(7,23,38,.72)), url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=70') center/cover no-repeat}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.72);border-radius:28px;padding:15px;box-shadow:0 18px 42px rgba(13,47,82,.10);backdrop-filter:blur(10px);width:100%;max-width:358px;margin-inline:auto}
.title h2{margin:0;font-size:20px;line-height:1.15;color:var(--navy)} .title p{margin:4px 0 0;font-size:12px;line-height:1.5;color:var(--muted)}
.field{display:grid;gap:6px;min-width:0} .field label{font-size:11px;font-weight:800;color:var(--navy)}
.field input,.field select{width:100%;min-width:0;border:1px solid rgba(13,47,82,.1);background:#f8fbfd;border-radius:16px;padding:13px 14px;font-size:14px;color:var(--text);outline:none} .field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(40,117,167,.12)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.primary{border:0;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:16px;padding:14px 16px;font-size:14px;font-weight:900;box-shadow:0 14px 24px rgba(13,47,82,.15)}
.secondary{border:1px solid rgba(13,47,82,.08);background:#fff;color:var(--navy);border-radius:16px;padding:13px 16px;font-size:13px;font-weight:800}
.link{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:800;padding:4px 0}
.mini{font-size:11px;line-height:1.45;color:var(--muted)}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;width:100%;max-width:100%;overflow:hidden} .otp input{width:100%;min-width:0;height:42px;padding:0;border:1px solid rgba(13,47,82,.1);background:#f8fbfd;border-radius:14px;text-align:center;font-size:16px;font-weight:800}
.pass-rules{display:grid;gap:6px;padding:10px 12px;border-radius:16px;background:#f7fafc;border:1px solid rgba(13,47,82,.06)} .pass-rules div{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted)} .pass-rules div.ok{color:var(--navy)} .pass-rules b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:#e7eef5;font-size:10px;color:#8ca0b0} .pass-rules div.ok b{background:rgba(213,177,109,.18);color:#76581a}
.stepper{display:flex;gap:8px;width:100%;max-width:358px;margin-inline:auto} .stepper span{flex:1;height:6px;border-radius:999px;background:#e6edf4} .stepper span.on{background:linear-gradient(90deg,var(--navy),var(--gold))}
.choice-grid{display:grid;gap:10px;width:100%;max-width:358px;margin-inline:auto}
.choice{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid rgba(13,47,82,.06);background:linear-gradient(180deg,#fff,#f8fbfd);padding:14px;border-radius:20px;text-align:left;box-shadow:0 8px 18px rgba(13,47,82,.04)}
.choice .ico{width:42px;height:42px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(40,117,167,.12),rgba(213,177,109,.18));color:var(--navy);font-size:18px;font-weight:900} .choice strong{display:block;font-size:13px;color:var(--navy)} .choice small{display:block;margin-top:4px;font-size:11px;color:var(--muted);line-height:1.35} .choice b{font-size:16px;color:#9baebb}
.account-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%} .account-selector button{border:1px solid rgba(13,47,82,.06);background:#fff;border-radius:20px;padding:16px;text-align:left} .account-selector button.active{background:#eef6fa;border-color:rgba(40,117,167,.20)} .account-selector strong{display:block;font-size:13px;color:var(--navy)} .account-selector small{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.cover-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;width:100%;max-width:358px;margin-inline:auto} .photo-big{min-height:150px;border-radius:26px;position:relative;overflow:hidden;background:linear-gradient(0deg,rgba(20,52,81,.64),rgba(20,52,81,.20)), url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=70') center/cover no-repeat} .photo-big span{position:absolute;left:14px;bottom:14px;color:#fff;font-size:12px;font-weight:700} .cover-col{display:grid;gap:12px} .photo-mini{min-height:69px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(0deg,rgba(20,52,81,.64),rgba(20,52,81,.20)), url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=70') center/cover no-repeat} .photo-mini span{position:absolute;left:12px;bottom:12px;color:#fff;font-size:11px;font-weight:700}
.identity-summary{padding:14px;border-radius:20px;background:linear-gradient(135deg,rgba(40,117,167,.10),rgba(213,177,109,.12));border:1px solid rgba(13,47,82,.06)} .identity-summary strong{display:block;font-size:13px;color:var(--navy)} .identity-summary small{display:block;margin-top:4px;font-size:11px;color:var(--muted)}
.welcome-stage{position:relative;height:100%;padding:0;display:grid;grid-template-rows:1fr auto;align-items:center;background:linear-gradient(180deg,rgba(8,24,39,.16),rgba(8,24,39,.72)), url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=70') center/cover no-repeat}
.welcome-copy{padding:40px 20px 16px;color:#fff;align-self:center;display:grid;justify-items:center;text-align:center}
.welcome-copy h1{margin:0;font-size:30px;line-height:1.04;letter-spacing:-.02em} .welcome-copy p{margin:10px 0 0;max-width:275px;font-size:13px;line-height:1.6;color:#e7eef5}
.sheet{background:rgba(255,255,255,.97);border-top-left-radius:30px;border-top-right-radius:30px;padding:18px 16px 16px;box-shadow:0 -12px 30px rgba(13,47,82,.10);width:100%} .sheet-handle{width:42px;height:5px;border-radius:999px;background:#d3dde6;margin:0 auto 14px} .sheet-card{padding:14px;border-radius:22px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end} .sheet-card h3{margin:0;font-size:20px;line-height:1.1;color:#fff} .sheet-card p{margin:6px 0 0;font-size:12px;color:#e7eef5} .sheet-badge{width:68px;height:68px;border-radius:22px;background:rgba(255,255,255,.14);display:grid;place-items:center;border:1px solid rgba(255,255,255,.18);font-size:26px}

.screen-app{display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(circle at right top, rgba(213,177,109,.12), transparent 20%), var(--soft)}
.topbar{padding:42px 16px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px} .topbar h2{margin:0;font-size:21px;line-height:1.1;color:var(--navy)} .topbar p{margin:4px 0 0;font-size:12px;color:var(--muted)} .avatar{width:42px;height:42px;border-radius:16px;border:1px solid rgba(13,47,82,.06);background:#fff;display:grid;place-items:center;color:var(--navy);font-weight:900;box-shadow:0 10px 18px rgba(13,47,82,.05)}
.content{min-height:0;padding:0 16px 12px;overflow:hidden} .view{height:100%;display:grid;gap:12px;align-content:start;min-height:0;overflow:hidden}
.panel{background:linear-gradient(180deg,#fff,#f8fbfd);border:1px solid rgba(13,47,82,.06);border-radius:24px;padding:14px;box-shadow:0 10px 24px rgba(13,47,82,.06)} .panel h3{margin:0 0 4px;font-size:16px;line-height:1.2;color:var(--navy)} .panel p{margin:0;font-size:12px;line-height:1.45;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.metric{padding:14px;border-radius:20px;background:#fff;border:1px solid rgba(13,47,82,.06);display:grid;gap:6px} .metric b{font-size:11px;color:var(--muted)} .metric strong{font-size:22px;line-height:1;color:var(--navy)} .metric span{font-size:11px;color:#5f7282}
.hero{position:relative;overflow:hidden;min-height:152px;border-radius:28px;padding:18px;color:#fff;display:grid;align-content:space-between;box-shadow:0 18px 40px rgba(13,47,82,.16)} .hero::after{content:'';position:absolute;right:-20px;bottom:-28px;width:120px;height:120px;border-radius:28px;background:rgba(255,255,255,.14);transform:rotate(18deg)} .hero>*{position:relative;z-index:1} .hero .tag{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.14);font-size:11px;border:1px solid rgba(255,255,255,.18)} .hero h3{margin:0;font-size:23px;line-height:1.06;color:#fff} .hero p{color:#e7eef5;font-size:12px;max-width:240px}
.list{display:grid;gap:10px} .item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:18px;background:#fff;border:1px solid rgba(13,47,82,.06)} .item .ico{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(40,117,167,.12),rgba(213,177,109,.18));color:var(--navy);font-size:16px} .item strong{display:block;font-size:13px;color:var(--navy)} .item small{display:block;margin-top:3px;font-size:11px;color:var(--muted)} .item b{font-size:10px;color:var(--blue)}
.nav-bottom{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 8px calc(8px + var(--safe));background:#fff;border-top:1px solid rgba(13,47,82,.06)} .nav-bottom button,.nav-floating button,.nav-pill button{border:0;background:none;display:grid;place-items:center;gap:2px;padding:7px 2px;color:#8fa2b0;border-radius:14px} .nav-bottom button span,.nav-floating button span,.nav-pill button span{font-size:18px} .nav-bottom button small,.nav-floating button small,.nav-pill button small{font-size:9px;font-weight:800}
.nav-bottom button.active{color:var(--navy);box-shadow:inset 0 -3px 0 var(--gold)} .nav-floating-wrap{padding:0 12px 12px;background:transparent} .nav-floating{display:grid;grid-template-columns:repeat(5,1fr);padding:6px;background:rgba(255,255,255,.98);border-radius:20px;border:1px solid rgba(13,47,82,.06);box-shadow:0 18px 34px rgba(13,47,82,.10)} .nav-floating button.active{background:#eef6fa;color:var(--navy)} .nav-pill-wrap{padding:0 12px 12px;background:transparent} .nav-pill{display:grid;grid-template-columns:repeat(5,1fr);padding:6px;background:linear-gradient(180deg,#fff,#f8fbfd);border-radius:999px;border:1px solid rgba(13,47,82,.06);box-shadow:0 18px 34px rgba(13,47,82,.10)} .nav-pill button.active{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}
.rail-nav{position:absolute;right:10px;top:128px;display:grid;gap:8px;z-index:5} .rail-nav button{width:50px;height:50px;border-radius:18px;border:1px solid rgba(13,47,82,.06);background:#fff;color:#8ea0ae;display:grid;place-items:center;font-size:18px;box-shadow:0 10px 20px rgba(13,47,82,.08)} .rail-nav button.active{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff} .rail-nav small{display:block;text-align:center;font-size:8px;color:var(--muted)}

.showcase{display:grid;gap:10px} .showcase-main{height:162px;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(20,52,81,.26),rgba(20,52,81,.78)), url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=70') center/cover no-repeat;box-shadow:0 18px 36px rgba(13,47,82,.14)} .showcase-main .caption{position:absolute;left:18px;right:18px;bottom:18px;color:#fff} .showcase-main .caption strong{display:block;font-size:22px;line-height:1.05} .showcase-main .caption small{display:block;margin-top:6px;font-size:12px;color:#ebf0f5} .showcase-dots{display:flex;justify-content:center;gap:6px} .showcase-dots span{width:7px;height:7px;border-radius:50%;background:#d8e2ea} .showcase-dots span.active{background:var(--gold)} .mini-promo{display:grid;grid-template-columns:1fr 1fr;gap:10px} .promo{min-height:96px;border-radius:22px;padding:14px;color:#fff;display:grid;align-content:end;position:relative;overflow:hidden} .promo.blue{background:linear-gradient(135deg,rgba(20,52,81,.96),rgba(43,121,182,.76))} .promo.gold{background:linear-gradient(135deg,rgba(201,166,90,.95),rgba(214,185,112,.72));color:#22384b} .promo strong{font-size:15px;line-height:1.1} .promo small{font-size:11px;line-height:1.4;opacity:.94;margin-top:4px}

.progress-hero{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:16px;border-radius:26px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff} .progress-hero h3{margin:0;font-size:22px;line-height:1.08;color:#fff} .progress-hero p{margin:6px 0 0;font-size:12px;color:#e7eef5} .progress-ring{width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) 0 76%, rgba(255,255,255,.16) 76% 100%);display:grid;place-items:center} .progress-ring span{width:54px;height:54px;border-radius:50%;background:rgba(12,39,66,.92);display:grid;place-items:center;font-size:13px;font-weight:900}
.task-stack{display:grid;gap:10px} .task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:13px;border-radius:20px;background:#fff;border:1px solid rgba(13,47,82,.06)} .task .dot{width:12px;height:12px;border-radius:50%;background:var(--gold)} .task strong{display:block;font-size:13px;color:var(--navy)} .task small{display:block;margin-top:4px;font-size:11px;color:var(--muted)} .task b{font-size:10px;color:var(--blue)} .command-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px} .command{padding:14px;border-radius:20px;background:linear-gradient(180deg,#fff,#f8fbfd);border:1px solid rgba(13,47,82,.06)} .command strong{display:block;font-size:13px;color:var(--navy)} .command small{display:block;margin-top:5px;font-size:11px;color:var(--muted);line-height:1.35}

.stream-wrap{min-height:0;border:1px solid rgba(13,47,82,.06);background:linear-gradient(180deg,#fff,#f8fbfd);border-radius:22px;padding:10px;display:grid;grid-template-rows:auto 1fr;gap:8px} .stream-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px;border-bottom:1px solid rgba(13,47,82,.06);font-size:11px;color:var(--muted)} .stream{min-height:0;overflow:auto;display:grid;gap:8px;align-content:start;padding-right:2px} .msg{display:flex;gap:8px;align-items:flex-end;max-width:100%} .msg.user{justify-content:flex-end} .role{width:30px;height:30px;border-radius:12px;display:grid;place-items:center;font-size:10px;font-weight:900;flex:0 0 auto} .msg.ai .role{background:#ebf2f8;color:var(--navy)} .msg.user .role{background:rgba(213,177,109,.2);color:#6d5321;order:2} .bubble{max-width:calc(100% - 42px);padding:11px 12px;border-radius:16px;font-size:12px;line-height:1.5;word-break:break-word;overflow-wrap:anywhere} .msg.ai .bubble{background:#eff5fa;color:#1f3447;border-top-left-radius:6px;border:1px solid rgba(13,47,82,.06)} .msg.user .bubble{background:var(--navy);color:#fff;border-top-right-radius:6px}
.compose{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px;border:1px solid rgba(13,47,82,.06);background:#fff;border-radius:18px} .compose input{width:100%;min-width:0;border:0;background:#f3f8fb;border-radius:14px;padding:13px 14px;font-size:13px;color:var(--text);outline:none} .compose button{border:0;border-radius:14px;min-width:86px;padding:0 14px;background:var(--gold);color:var(--navy);font-weight:900} .note{padding:10px 12px;border-radius:16px;background:rgba(213,177,109,.12);border:1px solid rgba(213,177,109,.22);font-size:11px;line-height:1.45;color:#675124}

.profile-grid{display:grid;gap:12px} .profile-head{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center} .profile-head .pic{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--navy),var(--blue));display:grid;place-items:center;color:#fff;font-size:18px;font-weight:900} .profile-head strong{display:block;font-size:16px;color:var(--navy)} .profile-head small{display:block;margin-top:4px;font-size:12px;color:var(--muted)} .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px} .pair div{padding:12px;border-radius:18px;background:#fff;border:1px solid rgba(13,47,82,.06)} .pair b{display:block;font-size:11px;color:var(--muted);margin-bottom:5px} .pair span{font-size:13px;color:var(--navy);font-weight:800}

.camila-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 2px 4px}

.camila-title{min-width:0}
.camila-title h3{margin:0;font-size:18px;line-height:1.1;color:#f3f7fb}

.camila-actions{display:flex;align-items:center;gap:8px}

.camila-status{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);font-size:11px;color:#d3dce6}

@keyframes camPulse{0%,100%{transform:scale(.85);opacity:.7}50%{transform:scale(1.15);opacity:1}}
.camila-thread{min-height:0;overflow:auto;padding:4px 2px 2px;display:grid;align-content:start;gap:10px}

.camila-v4 .chat-row.user .chat-bubble{background:linear-gradient(135deg,#76581a,#b88f45);color:#fff8ea}
.camila-compose{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:10px;border-radius:18px;background:#0f151d;border:1px solid rgba(255,255,255,.06)}

/* --- QA spacing + transitions --- */
button{min-width:0}
.topbar>div,.profile-choice>div:nth-child(2),.account-head,.card,.panel,.auth-hero,.content,.view{min-width:0}
.topbar p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen-auth,.screen-app,.account-screen{opacity:0;transform:translateY(8px) scale(.992)}
.screen-auth.enter,.screen-app.enter,.account-screen.enter{opacity:1;transform:none;animation:screenEnter .34s cubic-bezier(.2,.8,.2,1)}
@keyframes screenEnter{0%{opacity:0;transform:translateY(10px) scale(.992)}100%{opacity:1;transform:none}}
.nav-bottom button,.nav-floating button,.nav-pill button,.rail-nav button,.primary,.secondary,.profile-choice,.icon-btn,.camila-send,.avatar,.toggle,.link{transition:transform .18s ease, box-shadow .18s ease, background .2s ease, color .2s ease, border-color .2s ease, opacity .2s ease}
.nav-bottom button:active,.nav-floating button:active,.nav-pill button:active,.rail-nav button:active,.primary:active,.secondary:active,.profile-choice:active,.icon-btn:active,.camila-send:active,.avatar:active{transform:scale(.98)}
.camila-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:6px 4px 4px}
.camila-actions{display:flex;align-items:center;gap:8px;justify-self:end;flex:0 0 auto;padding-right:2px}
.camila-compose{display:grid;grid-template-columns:42px minmax(0,1fr) 42px 82px;gap:8px;align-items:center;padding:10px}
.camila-compose>*{min-width:0}
.camila-send{width:100%;min-width:0;padding:0 10px}
.chat-bubble{max-width:100%}
.profile-choice{width:100%;max-width:100%}
.profile-choice em{padding-left:4px;justify-self:end}
.row2 button{min-width:0}
#appLoader{position:fixed;inset:0;display:grid;place-items:center;background:rgba(7,18,30,.94);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:9999}
#appLoader.show{opacity:1;pointer-events:auto}
.loader-card{width:108px;height:108px;border-radius:28px;background:rgba(12,17,24,.92);border:1px solid rgba(255,255,255,.06);display:grid;place-items:center;box-shadow:0 22px 50px rgba(0,0,0,.22)}
.loader-core{display:grid;justify-items:center;gap:14px}

.loader-dots span:nth-child(3){animation-delay:.3s}

@media (prefers-reduced-motion:reduce){.screen-auth,.screen-app,.account-screen{opacity:1;transform:none}.screen-auth.enter,.screen-app.enter,.account-screen.enter{animation:none}.loader-dots span{animation:none}.nav-bottom button,.nav-floating button,.nav-pill button,.rail-nav button,.primary,.secondary,.profile-choice,.icon-btn,.camila-send,.avatar,.toggle,.link{transition:none}}


/* biometric + QR simulation */
.sim-overlay{position:absolute;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(8,16,26,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.sim-brand{display:flex;align-items:center;gap:10px;min-width:0}.sim-brand strong{font-size:15px}.sim-brand small{display:block;font-size:11px;color:#9db0c2}
.sim-close{width:34px;height:34px;border:0;border-radius:12px;background:#1b2633;color:#dbe7f1;font-size:18px}
.sim-body{display:grid;justify-items:center;gap:16px;min-width:0}
.face-stage{width:190px;height:190px;border-radius:38px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at top,rgba(39,116,167,.32),transparent 42%),linear-gradient(180deg,#132030,#0c141d);border:1px solid rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}

.face-ring:before{inset:-10px;border-color:rgba(213,177,109,.24)}
.face-ring:after{inset:10px;border-color:rgba(255,255,255,.18)}

.face-frame:before{top:28px;width:36px;height:2px}
.face-frame:after{bottom:28px;width:30px;height:2px;border-radius:999px}
.face-scan{position:absolute;left:26px;right:26px;height:6px;border-radius:999px;background:linear-gradient(90deg,transparent,rgba(125,224,255,.95),transparent);box-shadow:0 0 16px rgba(77,196,255,.72);animation:faceScan 1.8s ease-in-out infinite}
@keyframes faceScan{0%{top:34px;opacity:.55}50%{top:150px;opacity:1}100%{top:34px;opacity:.55}}
.bio-grid{display:grid;gap:10px;width:100%}
.qr-stage{width:100%;height:220px;border-radius:28px;position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(18,30,43,.5),rgba(8,13,20,.82)),url('https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=70') center/cover no-repeat;border:1px solid rgba(255,255,255,.06)}
.qr-camera-dot{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:56px;height:6px;border-radius:999px;background:rgba(255,255,255,.2)}
.qr-window{position:absolute;inset:48px;border-radius:26px;border:2px solid rgba(255,255,255,.78);box-shadow:0 0 0 999px rgba(0,0,0,.14)}

/* full-screen Camila */

.camila-full .chat-row{width:100%;min-width:0}.camila-full .chat-bubble{max-width:min(82%,282px);font-size:12px;line-height:1.52;padding:11px 12px}.camila-full .chat-row.ai .chat-bubble{background:#171f29;color:#eef4fa;border:1px solid rgba(255,255,255,.045)}.camila-full .chat-row.user .chat-bubble{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff}.camila-full .chat-avatar{width:28px;height:28px;min-width:28px;border-radius:10px;font-size:9px}

.voice-mode{height:100%;display:grid;grid-template-rows:auto 1fr auto;min-height:0;background:radial-gradient(circle at 50% 44%,rgba(38,116,168,.20),transparent 32%),linear-gradient(180deg,#090f16,#0f1721);padding:38px 16px max(14px,env(safe-area-inset-bottom));color:#fff}.voice-mode-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.voice-mode-top button{width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.07);background:#151e29;color:#fff;display:grid;place-items:center}.voice-main{min-height:0;display:grid;align-content:center;justify-items:center;gap:22px;text-align:center}.voice-orb{width:168px;height:168px;border-radius:50%;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 36% 30%,#79d9ff 0%,#297ab4 31%,#153c61 62%,#0c1b2c 100%);box-shadow:0 0 0 18px rgba(44,132,190,.07),0 0 65px rgba(49,155,220,.26);animation:voiceOrb 2s ease-in-out infinite}.voice-orb:after{content:'';position:absolute;inset:20px;border-radius:50%;border:1px solid rgba(255,255,255,.24)}@keyframes voiceOrb{0%,100%{transform:scale(.96);box-shadow:0 0 0 14px rgba(44,132,190,.06),0 0 50px rgba(49,155,220,.18)}50%{transform:scale(1.02);box-shadow:0 0 0 22px rgba(44,132,190,.08),0 0 78px rgba(49,155,220,.32)}}
.voice-wave{display:flex;align-items:center;justify-content:center;gap:5px;height:42px}.voice-wave span{width:4px;border-radius:999px;background:#d9f2ff;animation:waveBars 1s ease-in-out infinite}.voice-wave span:nth-child(1){height:12px}.voice-wave span:nth-child(2){height:24px;animation-delay:.12s}.voice-wave span:nth-child(3){height:34px;animation-delay:.24s}.voice-wave span:nth-child(4){height:20px;animation-delay:.36s}.voice-wave span:nth-child(5){height:29px;animation-delay:.48s}@keyframes waveBars{0%,100%{transform:scaleY(.55);opacity:.5}50%{transform:scaleY(1.15);opacity:1}}
.voice-transcript{max-width:300px;min-height:52px;font-size:15px;line-height:1.5;color:#edf7fb}.voice-hint{font-size:10px;color:#8295a8}.voice-bottom{display:grid;grid-template-columns:1fr 64px 1fr;align-items:center}.voice-stop{grid-column:2;width:64px;height:64px;border:0;border-radius:50%;background:#f1f5f8;color:#101923;display:grid;place-items:center;box-shadow:0 14px 32px rgba(0,0,0,.22)}.voice-stop .svg-icon{width:23px;height:23px}.voice-cancel{justify-self:start;border:0;background:transparent;color:#9fb0c0;font-size:11px;font-weight:800}

.typing-bubble{width:58px!important;min-width:58px!important;height:42px!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:5px!important;padding:0!important}.typing-bubble i{width:6px!important;height:6px!important;flex:0 0 6px;border-radius:50%;background:#9cafbf;animation:typingDots 1.15s infinite ease-in-out}.typing-bubble i:nth-child(2){animation-delay:.14s}.typing-bubble i:nth-child(3){animation-delay:.28s}@keyframes typingDots{0%,70%,100%{transform:translateY(0);opacity:.42}35%{transform:translateY(-4px);opacity:1}}

/* voice */

<body>
<div class="frame"><div class="phone"><div class="notch"></div><div id="app"></div><div id="toast" class="toast"></div><div id="splash" class="splash"></div></div></div>
<script>
const cfg={"file": "CCL_App_V4_Concierge_Combo.html", "title": "Concierge", "start": "combo", "auth": "welcome", "home": "concierge", "nav": "pill", "brand": "combo", "hero": "https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1200&q=70", "navy": "#0c2742", "blue": "#286f9f", "gold": "#d5b16d"};
const user={name:'Andrea Salazar Vega', email:'andrea.salazar@redcomercial.pe', company:'Red Comercial Andina S.A.C.', ruc:'20604587931'};
const profiles=[{id:'personal',type:'persona',name:'Andrea Salazar Vega',sub:'DNI 4728••••',email:'andrea.salazar@redcomercial.pe'},{id:'empresa1',type:'empresa',name:'Comercio Andino del Pacífico S.A.C.',sub:'RUC 20605432198',email:'contacto@comercioandino.pe'},{id:'empresa2',type:'empresa',name:'Grupo Mercantil Lima Centro S.A.',sub:'RUC 20517894326',email:'contacto@mercantillima.pe'}];
const state={screen:'auth', page:'home', authView:'login', createStep:1, recoverStep:1, accountType:'persona', activeProfile:profiles[0], pass:'', biometrics:true, messages:[{role:'ai',text:'Hola. Soy Camila. ¿En qué puedo ayudarte hoy?'}], chatDraft:'', speakReplies:true, listening:false, speaking:false, simType:null};
if(cfg.auth==='cover') state.authView='cover';
if(cfg.auth==='identify') state.authView='choose';
if(cfg.auth==='welcome') state.authView='welcome';
const app=document.getElementById('app');
function ensureLoader(){let el=document.getElementById('appLoader');if(el) return el;el=document.createElement('div');el.id='appLoader';el.innerHTML=`<div class="loader-card" aria-live="polite" aria-label="Procesando"><div class="loader-core"><div class="loader-mark">${icon('sparkle','lg')}</div><div class="loader-dots"><span></span><span></span><span></span></div></div></div>`;document.body.appendChild(el);return el}
function runWithLoader(cb,delay=620){const el=ensureLoader();el.classList.add('show');clearTimeout(window.__loaderTimer);window.__loaderTimer=setTimeout(()=>{cb&&cb();requestAnimationFrame(()=>el.classList.remove('show'))},delay)}
function goToPage(page){if(state.page===page) return;state.page=page;render()}
function openAuth(view,createStep){state.authView=view;if(createStep!=null) state.createStep=createStep;render()}
function resetPassAndOpen(view){state.pass='';state.authView=view;render()}
function openRecoverStart(view){state.pass='';state.recoverStep=1;state.authView=view;render()}
function setAccountType(type){state.accountType=type;render()}
function setCreateStep(step){state.createStep=step;render()}
function setRecoverStep(step){state.recoverStep=step;render()}
function finishCreate(view){toast('Cuenta creada');state.pass='';state.createStep=1;state.authView=view;render()}
function finishRecover(view,msg){toast(msg);state.pass='';state.recoverStep=1;state.authView=view;render()}
function openAccountSwitcher(){state.screen='account';render()}
function ensureSimOverlay(){let el=document.getElementById('simOverlay');if(el) return el;el=document.createElement('div');el.id='simOverlay';el.className='sim-overlay';document.querySelector('.phone').appendChild(el);return el}
function closeSimOverlay(){const el=document.getElementById('simOverlay');if(el) el.classList.remove('show');clearTimeout(window.__sim1);clearTimeout(window.__sim2);clearTimeout(window.__sim3)}
function showBiometricSim(){const el=ensureSimOverlay();el.innerHTML=`<div class="sim-card"><div class="sim-head"><div class="sim-brand"><div class="camila-mark" style="width:38px;height:38px;border-radius:14px;font-size:14px">◎</div><div><strong>${icon('face','sm')} Acceso biométrico</strong><small>Verificación segura</small></div></div><button class="sim-close" onclick="closeSimOverlay()">×</button></div><div class="sim-body"><div class="face-stage"><div class="face-ring"></div><div class="face-frame"></div><div class="face-scan"></div></div><div id="simStatus" class="sim-status">Alinea tu rostro dentro del marco para continuar.</div><div class="sim-actions"><button class="sim-btn secondary" onclick="closeSimOverlay()">Cancelar</button><button class="sim-btn primary" onclick="completeBiometricSim()">Continuar</button></div></div></div>`;el.classList.add('show')}
function completeBiometricSim(){const el=ensureSimOverlay();const status=el.querySelector('#simStatus');if(status) status.textContent='Verificando identidad biométrica…';window.__sim1=setTimeout(()=>{if(status) status.textContent='Biometría validada. Ingresando…';},1100);window.__sim2=setTimeout(()=>{closeSimOverlay();login();},1900)}
function showQrSim(){const el=ensureSimOverlay();el.innerHTML=`<div class="sim-card"><div class="sim-head"><div class="sim-brand"><div class="camila-mark" style="width:38px;height:38px;border-radius:14px;font-size:14px">⌁</div><div><strong>${icon('qr','sm')} Ingreso por QR</strong><small>Escanea tu código para entrar</small></div></div><button class="sim-close" onclick="closeSimOverlay()">×</button></div><div class="sim-body"><div class="qr-stage"><div class="qr-camera-dot"></div><div class="qr-window"><div class="qr-line"></div><div class="qr-code-fake"></div></div></div><div id="simStatus" class="sim-status">Activa la cámara y coloca el código dentro del marco.</div><div class="sim-actions"><button class="sim-btn secondary" onclick="closeSimOverlay()">Cancelar</button><button class="sim-btn primary" onclick="completeQrSim()">Usar cámara</button></div></div></div>`;el.classList.add('show')}
function completeQrSim(){const el=ensureSimOverlay();const status=el.querySelector('#simStatus');if(status) status.textContent='Cámara activa. Buscando código…';window.__sim1=setTimeout(()=>{if(status) status.textContent='Código detectado y validado.';},1200);window.__sim2=setTimeout(()=>{if(status) status.textContent='Ingresando…';},1800);window.__sim3=setTimeout(()=>{closeSimOverlay();login();},2350)}

const $=s=>document.querySelector(s);

function icon(name,size=''){
  const cls=`svg-icon ${size}`.trim();
  const icons={
    home:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3l8.5 7.5"/><path d="M5.5 9.5V21h13V9.5"/><path d="M9.5 21v-6h5v6"/></svg>`,
    services:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>`,
    calendar:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 10h18"/><path d="M8 14h3M13 14h3M8 17h3"/></svg>`,
    sparkle:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.7 4.3L18 9l-4.3 1.7L12 15l-1.7-4.3L6 9l4.3-1.7L12 3Z"/><path d="m18.5 15 .8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></svg>`,
    user:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4.5 21c.8-4.2 3.4-6.5 7.5-6.5s6.7 2.3 7.5 6.5"/></svg>`,
    gift:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18"/><path d="M12 9H8.2A2.2 2.2 0 1 1 10 5.5L12 9Zm0 0h3.8A2.2 2.2 0 1 0 14 5.5L12 9Z"/></svg>`,
    qr:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z"/><path d="M14 14h3v3h-3zM18 14h2v2M14 19h2M19 18v2h-2"/></svg>`,
    shield:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 2.7 8 7 10 4.3-2 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>`,
    file:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 12h6M9 16h6"/></svg>`,
    check:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></svg>`,
    mic:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6"/></svg>`,
    volume:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9c1.3 1.7 1.3 4.3 0 6M18.5 6.5c3 3 3 8 0 11"/></svg>`,
    send:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 17 8-17 8 3-8-3-8Z"/><path d="M7 12h14"/></svg>`,
    face:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2"/><circle cx="9" cy="10" r=".8" fill="currentColor" stroke="none"/><circle cx="15" cy="10" r=".8" fill="currentColor" stroke="none"/><path d="M9 15c1.8 1.3 4.2 1.3 6 0"/></svg>`,
    arrow:`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M14 7l5 5-5 5"/></svg>`
  };
  return icons[name]||icons.sparkle;
}

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>el.classList.remove('show'),1800)}
function passRules(v){return {len:v.length>=8, upper:/[A-ZÁÉÍÓÚÑ]/.test(v), num:/\d/.test(v), sp:/[^A-Za-z0-9]/.test(v)}}
function rulesHtml(v){const r=passRules(v);const item=(ok,tx)=>`<div class="${ok?'ok':''}"><b>${ok?'✓':'•'}</b><span>${tx}</span></div>`;return `<div class="pass-rules">${item(r.len,'Mínimo 8 caracteres')}${item(r.upper,'Al menos 1 mayúscula')}${item(r.num,'Al menos 1 número')}${item(r.sp,'Al menos 1 carácter especial')}</div>`;}
function titleBlock(t,p){return `<div class="title"><h2>${t}</h2>${p?`<p>${p}</p>`:''}</div>`}
function logoFull(md=false){return `<div class="official-logo ${md?'md':''}"><div class="logo-box"><img src="https://www.camaralima.org.pe/wp-content/uploads/2026/05/logo-ccl-1536x349-1.webp" alt="Cámara de Comercio de Lima"></div></div>`}
function logoIsotipo(sm=false){return `<div class="official-isotipo ${sm?'sm':''}"><div class="symbol-box mono" aria-label="CCL"><div class="mono-word">CCL</div></div></div>`}
function logoText(){return `<div class="brand-textual"><div class="text-card"><strong>Cámara de Comercio de Lima</strong></div></div>`}
function logoCombo(){return `<div class="official-logo md"><div class="logo-box"><img src="https://www.camaralima.org.pe/wp-content/uploads/2026/05/logo-ccl-1536x349-1.webp" alt="Cámara de Comercio de Lima"></div></div>`}
function renderSplash(){const s=$('#splash'); if(cfg.start==='logo') s.innerHTML=`<div class="splash center start-logo"><div class="splash-brand">${logoFull()}<div class="loader-bar"><span></span></div></div></div>`; if(cfg.start==='isotipo') s.innerHTML=`<div class="splash center start-isotipo"><div class="splash-brand">${logoIsotipo()}<div class="loader-dots"><span></span><span></span><span></span></div></div></div>`; if(cfg.start==='text') s.innerHTML=`<div class="splash center start-text"><div class="splash-brand">${logoText()}<div class="tech-grid"><span></span><span></span><span></span><span></span><span></span></div></div></div>`; if(cfg.start==='combo') s.innerHTML=`<div class="splash center start-combo"><div class="splash-brand">${logoCombo()}<div class="ring"></div></div></div>`; setTimeout(()=>{s.classList.add('hide');setTimeout(()=>s.remove(),480)},1650);}
function afterRender(){const screen=app.firstElementChild;if(screen){requestAnimationFrame(()=>screen.classList.add('enter'))}if(state.screen==='auth') bindPass();if(state.screen==='app'&&state.page==='camila') bindChat()}
function render(){state.screen==='auth'?renderAuth():state.screen==='account'?renderAccountSelect():renderApp()}
function renderAuth(){app.innerHTML=`<div class="screen-auth ${cfg.home}">${authView()}</div>`;afterRender()}
function authView(){if(cfg.auth==='direct') return authDirect(); if(cfg.auth==='cover') return authCover(); if(cfg.auth==='identify') return authIdentify(); return authWelcome();}
function authDirect(){
  if(state.authView==='login') return `<div class="auth-page"><div class="auth-hero solid"><div class="hero-brand">${logoFull(true)}</div><div class="hero-copy-centered"><h1>Iniciar sesión</h1></div></div><div class="card">${titleBlock('Acceso CCL','')}<div class="field" style="margin-top:12px"><label>Correo, DNI, CE o RUC</label><input placeholder="Ingresa tu correo o documento"></div><div class="field" style="margin-top:10px"><label>Contraseña</label><input type="password" placeholder="Tu contraseña"></div><div class="row2" style="margin-top:10px"><button class="secondary" onclick="showBiometricSim()">Biometría</button><button class="secondary" onclick="showQrSim()">Ingreso QR</button></div><button class="primary" style="margin-top:10px;width:100%" onclick="login()">Ingresar</button><div class="row2" style="margin-top:8px"><button class="link" onclick="openAuth('recover')">Recuperar acceso</button><button class="link" onclick="openAuth('register')">Crear cuenta</button></div></div></div>`;
  if(state.authView==='register') return `<div class="auth-page"><div class="card">${titleBlock('Crear cuenta','')}<div class="registration-type"><div class="account-selector"><button class="${state.accountType==='persona'?'active':''}" onclick="setAccountType('persona')"><strong>Persona</strong><small>DNI o CE</small></button><button class="${state.accountType==='empresa'?'active':''}" onclick="setAccountType('empresa')"><strong>Empresa</strong><small>RUC</small></button></div></div>${state.accountType==='persona'?`<div class="row2" style="margin-top:12px"><div class="field"><label>Nombres</label><input placeholder="Andrea"></div><div class="field"><label>Apellidos</label><input placeholder="Salazar"></div></div><div class="row2" style="margin-top:10px"><div class="field"><label>Documento</label><select><option>DNI</option><option>CE</option></select></div><div class="field"><label>Número</label><input placeholder="73651248"></div></div><div class="field" style="margin-top:10px"><label>Correo</label><input placeholder="correo@ejemplo.pe"></div>`:`<div class="field" style="margin-top:12px"><label>Razón social</label><input placeholder="Comercio Andino del Pacífico S.A.C."></div><div class="field" style="margin-top:10px"><label>RUC</label><input placeholder="20605432198"></div><div class="field" style="margin-top:10px"><label>Correo empresarial</label><input placeholder="contacto@empresa.pe"></div>`}<div class="field" style="margin-top:10px"><label>Contraseña</label><input id="passInput" type="password" placeholder="Crea tu contraseña"></div>${rulesHtml(state.pass)}<div class="row2" style="margin-top:10px"><button class="secondary" onclick="resetPassAndOpen('login')">Volver</button><button class="primary" onclick="finishCreate('login')">Crear cuenta</button></div></div></div>`;
  return `<div class="auth-page"><div class="card">${titleBlock('Recuperar acceso','')}${state.recoverStep===1?`<div class="field" style="margin-top:12px"><label>Correo, DNI, CE o RUC</label><input placeholder="Ingresa tu correo o documento"></div><button class="primary" style="margin-top:10px;width:100%" onclick="setRecoverStep(2)">Enviar código</button>`:state.recoverStep===2?`<div class="field" style="margin-top:12px"><label>Código de 6 dígitos</label><div class="otp">${Array.from({length:6},(_,i)=>`<input maxlength="1" aria-label="dígito ${i+1}">`).join('')}</div></div><div class="row2" style="margin-top:10px"><button class="secondary" onclick="setRecoverStep(1)">Atrás</button><button class="primary" onclick="setRecoverStep(3)">Validar</button></div>`:`<div class="field" style="margin-top:12px"><label>Nueva contraseña</label><input id="passInput" type="password" placeholder="Nueva contraseña"></div>${rulesHtml(state.pass)}<div class="row2" style="margin-top:10px"><button class="secondary" onclick="setRecoverStep(2)">Atrás</button><button class="primary" onclick="finishRecover('login','Contraseña actualizada')">Guardar</button></div>`}<button class="link" style="margin-top:8px" onclick="openRecoverStart('login')">Volver</button></div></div>`;
}
function authCover(){

}
function renderMessages(){return state.messages.map(m=>`<div class="chat-row ${m.role==='ai'?'ai':'user'}">${m.role==='ai'?'<div class="chat-avatar">AI</div>':''}<div class="chat-bubble">${m.text}</div>${m.role==='user'?'<div class="chat-avatar">TÚ</div>':''}</div>`).join('')}
function bindChat(){
  const i=document.getElementById('chatInput');
  if(i){
    i.value=state.chatDraft||'';
    i.oninput=e=>state.chatDraft=e.target.value;
    i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCamila()}};
  }
  const s=document.getElementById('stream');
  if(s) s.scrollTop=s.scrollHeight;
}
function askCamila(text){state.messages.push({role:'user',text}); state.chatDraft=''; render(); setTimeout(()=>replyCamila(text),260)}
function sendCamila(){const i=document.getElementById('chatInput'); const t=((i?.value)||state.chatDraft||'').trim(); if(!t)return; if(i)i.value=''; askCamila(t)}
function toggleSpeakReplies(){state.speakReplies=!state.speakReplies; if(!state.speakReplies && window.speechSynthesis){window.speechSynthesis.cancel();state.speaking=false;} render();}
function speakText(text){
  if(!state.speakReplies || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='es-PE';
    u.rate=.97;
    u.pitch=1;
    u.volume=1;
    u.onstart=()=>{state.speaking=true;render();};
    u.onend=()=>{state.speaking=false;render();};
    u.onerror=()=>{state.speaking=false;render();};
    window.speechSynthesis.speak(u);
  }catch(e){state.speaking=false;}
}
function toggleVoiceInput(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(state.listening && window.__camilaRec){try{window.__camilaRec.stop()}catch(e){}; state.listening=false; render(); return;}
  if(!SR){toast('El navegador no tiene voz disponible'); return;}
  try{
    const rec=new SR();
    window.__camilaRec=rec;
    window.__camilaDraft='';
    rec.lang='es-PE';
    rec.interimResults=true;
    rec.maxAlternatives=1;
    rec.onstart=()=>{state.listening=true; render();};
    rec.onresult=(e)=>{
      let transcript='';
      for(let i=e.resultIndex;i<e.results.length;i++) transcript+=e.results[i][0].transcript;
      window.__camilaDraft=transcript.trim();
      state.chatDraft=window.__camilaDraft;
      const input=document.getElementById('chatInput');
      if(input) input.value=state.chatDraft;
    };
    rec.onerror=()=>{state.listening=false; render(); toast('No se pudo iniciar el micrófono');};
    rec.onend=()=>{
      const draft=(window.__camilaDraft||state.chatDraft||'').trim();
      state.listening=false;
      render();
      if(draft){ state.chatDraft=''; askCamila(draft); window.__camilaDraft=''; }
    };
    rec.start();
  }catch(e){state.listening=false; render(); toast('No se pudo iniciar el micrófono');}
}
function replyCamila(text){
  const t=text.toLowerCase();
  let ans='Puedo ayudarte con tus servicios, eventos, accesos y consultas de la CCL.';
  if(t.includes('benef')) ans='Puedes revisar tus beneficios vigentes desde la sección Servicios. Si deseas, también puedo orientarte según tu perfil activo.';
  else if(t.includes('evento')||t.includes('agenda')||t.includes('invit')) ans='En Eventos encontrarás tu agenda disponible, actividades e invitaciones relacionadas con tu cuenta.';
  else if(t.includes('biometr')) ans='La biometría puede activarse desde tu perfil para agilizar el ingreso y reforzar la seguridad.';
  else if(t.includes('qr')) ans='El ingreso por QR te permite acceder de forma rápida mediante un código generado o escaneado desde la app.';
  else if(t.includes('perfil')||t.includes('cuenta')||t.includes('seguridad')) ans='Desde Perfil puedes revisar tu cuenta activa, cambiar entre perfiles, gestionar biometría y cerrar sesión.';
  else if(t.includes('camila')||t.includes('hola')) ans='Hola. Soy Camila y puedo ayudarte con orientación general dentro de la app de la Cámara de Comercio de Lima.';
  state.messages.push({role:'ai',text:ans});
  render();
  setTimeout(()=>speakText(ans),100);
}

function businessMatchView(){
 const p=state.activeProfile;
 if(p.type!=='empresa') return `<div class="business-view"><div class="persona-match-empty"><div class="empty-box"><div class="empty-icon">${extraIcon('building','lg')}</div><strong>Usa un perfil de empresa</strong><small>Las recomendaciones empresariales se generan con los intereses y actividad de la empresa activa.</small><button class="primary" onclick="openAccountSwitcher()">Cambiar cuenta</button></div></div></div>`;
 const m=BUSINESS_MATCHES[state.matchIndex%BUSINESS_MATCHES.length];
 const score=companyScore(m,p);
 return `<div class="business-view"><div class="business-head"><small>Recomendaciones para ${p.name}</small><div class="interest-row">${(p.interests||[]).map(x=>`<span class="interest-chip">${x}</span>`).join('')}</div></div><div class="match-stage"><div id="matchCard" class="match-card ${cfg.home}"><div class="match-card-top"><div class="company-avatar">${m.initials}</div><div class="match-company"><strong>${m.name}</strong><small>${m.sector}</small></div><div class="match-score">${score}%</div></div><div class="match-about">${m.about}</div><div class="match-tags">${m.interests.map(x=>`<span class="match-tag">${x}</span>`).join('')}</div></div></div><div class="match-actions"><button class="match-action" onclick="matchAction('skip')" aria-label="Omitir">${extraIcon('close')}</button><button class="match-action" onclick="showMatchDetail()">Ver empresa</button><button class="match-action primary-match" onclick="matchAction('connect')" aria-label="Conectar">${extraIcon('heart')}</button></div></div>`;

function companyScore(m,p){const a=new Set((p.interests||[]).map(x=>x.toLowerCase()));const common=m.interests.filter(x=>a.has(x.toLowerCase())).length;return Math.min(96,68+common*10+(state.matchIndex%3)*3)}
function matchAction(action){const card=document.getElementById('matchCard');if(card){card.style.transform=`translateX(${action==='connect'?110:-110}px) rotate(${action==='connect'?5:-5}deg)`;card.style.opacity='.15'}setTimeout(()=>{const m=BUSINESS_MATCHES[state.matchIndex%BUSINESS_MATCHES.length];if(action==='connect'){state.matchedCompanies.push(m.name);toast('Solicitud de conexión enviada')}state.matchIndex=(state.matchIndex+1)%BUSINESS_MATCHES.length;render()},220)}
function bindMatchCard(){const card=document.getElementById('matchCard');if(!card)return;let start=0,dx=0;card.onpointerdown=e=>{start=e.clientX;dx=0;card.setPointerCapture(e.pointerId);card.classList.add('dragging')};card.onpointermove=e=>{if(!start)return;dx=e.clientX-start;card.style.transform=`translateX(${dx}px) rotate(${dx/30}deg)`};card.onpointerup=()=>{card.classList.remove('dragging');if(Math.abs(dx)>70){matchAction(dx>0?'connect':'skip')}else{card.style.transform=''}start=0;dx=0}}
function showMatchDetail(){const p=state.activeProfile,m=BUSINESS_MATCHES[state.matchIndex%BUSINESS_MATCHES.length];showInfo(m.name,m.sector,`${m.about} Afinidad estimada: ${companyScore(m,p)}%. Intereses: ${m.interests.join(', ')}.`)}

function openProfileEdit(){const p=state.activeProfile;state.editDraft={name:p.name,email:p.email,phone:p.phone||'',sector:p.sector||'',interests:[...(p.interests||[])]};state.page='profileEdit';render()}
function syncEditDraft(){const n=document.getElementById('editName'),e=document.getElementById('editEmail'),ph=document.getElementById('editPhone'),s=document.getElementById('editSector');if(n)state.editDraft.name=n.value;if(e)state.editDraft.email=e.value;if(ph)state.editDraft.phone=ph.value;if(s)state.editDraft.sector=s.value}
function toggleDraftInterest(x){syncEditDraft();const a=state.editDraft.interests||[];state.editDraft.interests=a.includes(x)?a.filter(v=>v!==x):[...a,x].slice(0,5);render()}
function profileEditView(){const p=state.activeProfile,d=state.editDraft||{name:p.name,email:p.email,phone:p.phone||'',sector:p.sector||'',interests:[...(p.interests||[])]};return `<div class="view"><div class="panel edit-form"><div class="field"><label>${p.type==='empresa'?'Razón social':'Nombre'}</label><input id="editName" value="${d.name}" oninput="state.editDraft.name=this.value"></div>${p.type==='empresa'?`<div class="field"><label>Sector</label><input id="editSector" value="${d.sector}" oninput="state.editDraft.sector=this.value"></div>`:''}<div class="field"><label>Correo</label><input id="editEmail" value="${d.email}" oninput="state.editDraft.email=this.value"></div><div class="field"><label>Teléfono</label><input id="editPhone" value="${d.phone}" oninput="state.editDraft.phone=this.value"></div>${p.type==='empresa'?`<div><label style="font-size:10px;font-weight:800;color:var(--navy)">Intereses empresariales</label><div class="edit-chips" style="margin-top:7px">${EDIT_INTERESTS.map(x=>`<button class="edit-chip ${(d.interests||[]).includes(x)?'on':''}" onclick="toggleDraftInterest('${x}')">${x}</button>`).join('')}</div></div>`:''}<div class="save-row"><button class="secondary" onclick="goToPage('profile')">Cancelar</button><button class="primary" onclick="saveProfile()">Guardar</button></div></div></div>`}
function saveProfile(){syncEditDraft();const p=state.activeProfile,d=state.editDraft;if(!d)return;p.name=d.name||p.name;p.email=d.email||p.email;p.phone=d.phone||p.phone;if(p.type==='empresa'){p.sector=d.sector||p.sector;p.interests=[...(d.interests||[])]}state.editDraft=null;state.page='profile';render();toast('Perfil actualizado')}

function camilaVariant(){if(cfg.home==='banking')return'camila-v1';if(cfg.home==='discovery')return'camila-v2';if(cfg.home==='productivity')return'camila-v3';return'camila-v4'}
function camilaView(){if(state.voiceMode)return camilaVoiceView();const p=state.activeProfile;return `<div class="camila-full ${camilaVariant()}"><div class="camila-full-head"><button class="camila-back" onclick="goToPage('home')" aria-label="Volver">${extraIcon('back')}</button><div class="camila-full-title"><strong>Camila</strong><small>Asistente virtual</small></div><div class="camila-head-actions"><button class="camila-head-action ${state.speakReplies?'active':''}" onclick="toggleSpeakReplies()" aria-label="Voz de Camila">${icon('volume')}</button></div></div><div class="camila-context-line"><span class="live-dot"></span><span>${p.type==='empresa'?p.name:'Cuenta personal'}${state.speaking?' · respondiendo por voz':''}</span></div><div id="stream" class="camila-full-thread">${renderMessages()}</div><div class="camila-full-compose"><div class="camila-input-wrap"><textarea id="chatInput" rows="1" placeholder="Mensaje a Camila"></textarea></div><button class="camila-mic ${state.listening?'active':''}" onclick="toggleVoiceInput()" aria-label="Hablar con Camila">${icon('mic')}</button><button class="camila-send2" onclick="sendCamila()" aria-label="Enviar">${icon('send')}</button></div></div>`}
function renderMessages(){let html=state.messages.map(m=>`<div class="chat-row ${m.role==='ai'?'ai':'user'}">${m.role==='ai'?'<div class="chat-avatar">AI</div>':''}<div class="chat-bubble">${m.text}</div>${m.role==='user'?'<div class="chat-avatar">TÚ</div>':''}</div>`).join('');if(state.typing)html+=`<div class="chat-row ai"><div class="chat-avatar">AI</div><div class="chat-bubble typing-bubble"><i></i><i></i><i></i></div></div>`;return html}
function bindChat(){const i=document.getElementById('chatInput');if(i){i.value=state.chatDraft||'';i.oninput=e=>{state.chatDraft=e.target.value;i.style.height='44px';i.style.height=Math.min(i.scrollHeight,84)+'px'};i.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCamila()}}}const s=document.getElementById('stream');if(s)s.scrollTop=s.scrollHeight}
function askCamila(text){state.messages.push({role:'user',text});state.chatDraft='';state.typing=true;render();setTimeout(()=>replyCamila(text),880)}
function sendCamila(){const i=document.getElementById('chatInput');const t=((i?.value)||state.chatDraft||'').trim();if(!t)return;if(i)i.value='';askCamila(t)}
function replyCamila(text){const t=text.toLowerCase(),p=state.activeProfile;let ans='Claro. Puedo ayudarte con información y gestiones dentro de la app de la Cámara de Comercio de Lima.';if(t.includes('empresa')||t.includes('conectar')||t.includes('proveedor')||t.includes('socio')||t.includes('match'))ans=p.type==='empresa'?`Puedo ayudarte a encontrar empresas compatibles con ${p.name}. En Conecta Empresas se priorizan coincidencias según intereses como ${(p.interests||[]).join(', ')||'tu sector'}.`:'Para buscar empresas compatibles necesitas activar uno de tus perfiles de empresa.';else if(t.includes('servicio')||t.includes('asesor'))ans='Entre los servicios disponibles encontrarás asesoría legal, orientación en comercio exterior, consultoría empresarial, capacitaciones, información y oportunidades de negocio.';else if(t.includes('evento')||t.includes('agenda'))ans='Hay actividades próximas como el webinar con INDECOPI del 11 de septiembre y el webinar con SUNAFIL del 18 de septiembre.';else if(t.includes('noticia')||t.includes('mype'))ans='En Noticias puedes revisar novedades empresariales, incluyendo información sobre MYPE manufactureras, economía circular, inversión y tendencias de mercado.';else if(t.includes('perfil')||t.includes('editar'))ans='Puedes editar los datos de tu perfil desde Perfil. En una cuenta de empresa también puedes actualizar sector e intereses para mejorar las recomendaciones.';else if(t.includes('biometr'))ans='La biometría está disponible como acceso rápido. Desde el inicio puedes abrir la simulación de verificación facial.';else if(t.includes('qr'))ans='El ingreso por QR abre una simulación de cámara, detecta el código y valida el acceso.';state.typing=false;state.messages.push({role:'ai',text:ans});render();setTimeout(()=>speakText(ans),120)}

function camilaVoiceView(){return `<div class="voice-mode"><div class="voice-mode-top"><button onclick="cancelVoiceMode()" aria-label="Cerrar">${extraIcon('close')}</button><span style="font-size:11px;color:#8ea2b5">Voz con Camila</span><span style="width:42px"></span></div><div class="voice-main"><div class="voice-orb"><div class="voice-wave"><span></span><span></span><span></span><span></span><span></span></div></div><div><div id="voiceTranscript" class="voice-transcript">${state.voiceTranscript||'Escuchando…'}</div><div class="voice-hint" style="margin-top:8px">Habla con naturalidad</div></div></div><div class="voice-bottom"><button class="voice-cancel" onclick="cancelVoiceMode()">Cancelar</button><button class="voice-stop" onclick="stopVoiceInput()" aria-label="Detener">${extraIcon('stop')}</button></div></div>`}
function toggleVoiceInput(){if(state.voiceMode){stopVoiceInput();return}startVoiceInput()}
function startVoiceInput(){state.voiceMode=true;state.listening=true;state.voiceTranscript='';state.voiceFallback=false;render();const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state.voiceFallback=true;window.__voiceDemo1=setTimeout(()=>updateVoiceTranscript('Busco empresas para exportación y logística'),850);window.__voiceDemo2=setTimeout(()=>stopVoiceInput(),2350);return}try{const rec=new SR();window.__camilaRec=rec;rec.lang='es-PE';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;rec.onresult=e=>{let tr='';for(let i=e.resultIndex;i<e.results.length;i++)tr+=e.results[i][0].transcript;state.voiceTranscript=tr.trim();updateVoiceTranscript(state.voiceTranscript||'Escuchando…')};rec.onerror=()=>{state.voiceFallback=true;updateVoiceTranscript('Busco empresas para exportación y logística');window.__voiceDemo2=setTimeout(()=>stopVoiceInput(),1000)};rec.onend=()=>{if(state.voiceMode&&!state.voiceFallback)stopVoiceInput()};rec.start()}catch(e){state.voiceFallback=true;window.__voiceDemo1=setTimeout(()=>updateVoiceTranscript('Muéstrame los próximos eventos de la CCL'),700);window.__voiceDemo2=setTimeout(()=>stopVoiceInput(),2000)}}
function updateVoiceTranscript(t){state.voiceTranscript=t;const el=document.getElementById('voiceTranscript');if(el)el.textContent=t}
function stopVoiceInput(){clearTimeout(window.__voiceDemo1);clearTimeout(window.__voiceDemo2);if(window.__camilaRec){try{window.__camilaRec.onend=null;window.__camilaRec.stop()}catch(e){}window.__camilaRec=null}const text=(state.voiceTranscript||'').trim();state.voiceMode=false;state.listening=false;state.voiceFallback=false;state.voiceTranscript='';render();if(text)askCamila(text)}
function cancelVoiceMode(){clearTimeout(window.__voiceDemo1);clearTimeout(window.__voiceDemo2);if(window.__camilaRec){try{window.__camilaRec.onend=null;window.__camilaRec.stop()}catch(e){}window.__camilaRec=null}state.voiceMode=false;state.listening=false;state.voiceFallback=false;state.voiceTranscript='';render()}

Object.assign(window,{showService,showEvent,showNews,showInfo,matchAction,showMatchDetail,openProfileEdit,toggleDraftInterest,saveProfile,startVoiceInput,stopVoiceInput,cancelVoiceMode,extraIcon});

 else if(t.includes('biometr'))ans='En el acceso puedes abrir la simulación biométrica: muestra la lectura facial, valida la identidad y luego continúa al ingreso.';
 else if(t.includes('qr'))ans='El ingreso por QR simula la cámara, detecta el código, valida la sesión y continúa al perfil correspondiente.';
 state.typing=false;state.webLookup=false;state.messages.push({role:'ai',text:ans,source,rich});render();setTimeout(()=>speakText(ans),120)}
function startVoiceInput(){state.voiceMode=true;state.listening=true;state.voiceTranscript='';state.voiceFallback=false;render();const samples=['¿Qué eventos tiene la CCL esta semana?','¿Qué servicios me recomiendas para exportar?','Busca una empresa compatible con logística y exportación','¿Qué noticias empresariales hay hoy?'];const fallback=samples[(state.messages.length+state.matchIndex)%samples.length];const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){state.voiceFallback=true;window.__voiceDemo1=setTimeout(()=>updateVoiceTranscript(fallback),650);window.__voiceDemo2=setTimeout(()=>stopVoiceInput(),2250);return}try{const rec=new SR();window.__camilaRec=rec;rec.lang='es-PE';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;rec.onresult=e=>{let tr='';for(let i=e.resultIndex;i<e.results.length;i++)tr+=e.results[i][0].transcript;state.voiceTranscript=tr.trim();updateVoiceTranscript(state.voiceTranscript||'Escuchando…')};rec.onerror=()=>{state.voiceFallback=true;updateVoiceTranscript(fallback);window.__voiceDemo2=setTimeout(()=>stopVoiceInput(),950)};rec.onend=()=>{if(state.voiceMode&&!state.voiceFallback)stopVoiceInput()};rec.start()}catch(e){state.voiceFallback=true;window.__voiceDemo1=setTimeout(()=>updateVoiceTranscript(fallback),600);window.__voiceDemo2=setTimeout(()=>stopVoiceInput(),2100)}}

function logout(){document.querySelectorAll('.rail-nav').forEach(n=>n.remove());if(window.speechSynthesis)window.speechSynthesis.cancel();state.voiceMode=false;state.listening=false;state.speaking=false;runWithLoader(()=>{document.querySelectorAll('.rail-nav').forEach(n=>n.remove());state.screen='auth';state.page='home';state.createStep=1;state.recoverStep=1;state.pass='';state.authView=cfg.auth==='direct'?'login':cfg.auth==='cover'?'cover':cfg.auth==='identify'?'choose':'welcome';render();toast('Sesión cerrada')},520)}
